
    <div class="calculator-container">
        <div class="calculator">
            <div class="display" id="display">0</div>
            <div class="buttons">
                <button class="btn clear-btn" onclick="clearDisplay()">C</button>
                <button class="btn" onclick="appendOperator('/')">÷</button>
                <button class="btn" onclick="appendOperator('*')">×</button>
                <button class="btn delete-btn" onclick="deleteLast()">DEL</button>
                
                <button class="btn" onclick="appendNumber('7')">7</button>
                <button class="btn" onclick="appendNumber('8')">8</button>
                <button class="btn" onclick="appendNumber('9')">9</button>
                <button class="btn" onclick="appendOperator('-')">−</button>
                
                <button class="btn" onclick="appendNumber('4')">4</button>
                <button class="btn" onclick="appendNumber('5')">5</button>
                <button class="btn" onclick="appendNumber('6')">6</button>
                <button class="btn" onclick="appendOperator('+')">+</button>
                
                <button class="btn" onclick="appendNumber('1')">1</button>
                <button class="btn" onclick="appendNumber('2')">2</button>
                <button class="btn" onclick="appendNumber('3')">3</button>
                <button class="btn equals-btn" onclick="calculate()" style="grid-row: span 2;">=</button>
                
                <button class="btn zero-btn" onclick="appendNumber('0')">0</button>
                <button class="btn" onclick="appendNumber('.')">.</button>
            </div>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let expression = '';

        function appendNumber(num) {
            if (num === '.' && expression.includes('.')) return;
            expression += num;
            updateDisplay(expression);
        }

        function appendOperator(op) {
            if (expression === '') return;
            if (['+', '-', '*', '/'].includes(expression.slice(-1))) {
                expression = expression.slice(0, -1) + op;
            } else {
                expression += op;
            }
            updateDisplay(expression);
        }

        function clearDisplay() {
            expression = '';
            updateDisplay('0');
        }

        function deleteLast() {
            expression = expression.slice(0, -1);
            updateDisplay(expression || '0');
        }

        function calculate() {
            if (expression === '') return;
            try {
                const result = eval(expression);
                expression = result.toString();
                updateDisplay(result);
            } catch (error) {
                updateDisplay('Error');
                expression = '';
            }
        }

        function updateDisplay(value) {
            display.textContent = value || '0';
        }
    </script>
</body>
</html>
