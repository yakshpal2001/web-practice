<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="calculator">
            <div class="top-panel">
                <h1 class="title">MECHANICAL CALCULATOR</h1>
            </div>
            
            <div class="display-section">
                <div class="display-label">RESULT</div>
                <div class="display" id="display">0</div>
                <div class="tape"></div>
            </div>

            <div class="buttons-container">
                <div class="button-row">
                    <button class="btn clear-btn" onclick="clearDisplay()">CLEAR</button>
                    <button class="btn delete-btn" onclick="deleteLast()">← DEL</button>
                </div>

                <div class="button-grid">
                    <button class="btn num-btn" onclick="appendNumber('7')">7</button>
                    <button class="btn num-btn" onclick="appendNumber('8')">8</button>
                    <button class="btn num-btn" onclick="appendNumber('9')">9</button>
                    <button class="btn operator-btn" onclick="appendOperator('÷')">÷</button>
                    
                    <button class="btn num-btn" onclick="appendNumber('4')">4</button>
                    <button class="btn num-btn" onclick="appendNumber('5')">5</button>
                    <button class="btn num-btn" onclick="appendNumber('6')">6</button>
                    <button class="btn operator-btn" onclick="appendOperator('×')">×</button>
                    
                    <button class="btn num-btn" onclick="appendNumber('1')">1</button>
                    <button class="btn num-btn" onclick="appendNumber('2')">2</button>
                    <button class="btn num-btn" onclick="appendNumber('3')">3</button>
                    <button class="btn operator-btn" onclick="appendOperator('−')">−</button>
                    
                    <button class="btn num-btn zero-btn" onclick="appendNumber('0')">0</button>
                    <button class="btn num-btn" onclick="appendNumber('.')">.</button>
                    <button class="btn operator-btn" onclick="appendOperator('+')">+</button>
                </div>

                <button class="btn equals-btn" onclick="calculate()">=</button>
            </div>

            <div class="bottom-panel">
                <div class="metal-plate">Made in INDIA</div>
            </div>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let expression = '';

        function appendNumber(num) {
            if (num === '.' && expression.includes('.')) return;
            expression += num;
            updateDisplay(expression);
        }

        function appendOperator(op) {
            if (expression === '') return;
            const operators = ['÷', '×', '−', '+'];
            const operatorMap = {'÷': '/', '×': '*', '−': '-'};
            
            if (operators.some(o => expression.endsWith(o))) {
                expression = expression.slice(0, -1) + op;
            } else {
                expression += op;
            }
            updateDisplay(expression);
        }

        function clearDisplay() {
            expression = '';
            updateDisplay('0');
        }

        function deleteLast() {
            expression = expression.slice(0, -1);
            updateDisplay(expression || '0');
        }

        function calculate() {
            if (expression === '') return;
            try {
                const normalizedExpr = expression
                    .replace(/÷/g, '/')
                    .replace(/×/g, '*')
                    .replace(/−/g, '-');
                const result = eval(normalizedExpr);
                expression = result.toString();
                updateDisplay(result);
            } catch (error) {
                updateDisplay('ERROR');
                expression = '';
            }
        }

        function updateDisplay(value) {
            display.textContent = value || '0';
        }
    </script>
</body>
</html>
